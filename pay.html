<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay MOZLYT</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<style>
  :root { --gold:#1F9D6B; --bg:#F4F7F5; --card:#ffffff; --text:#0E2A47; --muted:#5b6b7d; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:16px; padding:24px; border:1px solid #DCE4DE; }
  h1 { margin:0 0 4px; font-size:22px; color:var(--gold); }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid #C9D3CC; background:#fff; color:var(--text); font-size:16px; }
  button { width:100%; margin-top:22px; padding:14px; border:0; border-radius:10px; background:var(--gold);
           color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; }
  #msg { margin-top:14px; font-size:14px; min-height:20px; }
  .ok { color:#14804f; } .err { color:#c0392b; }
  .note { margin-top:16px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="card">
  <h1>MOZLYT</h1>
  <p class="sub" id="sub">Pay for your agreed service or order</p>

  <label for="name">Full name</label>
  <input id="name" type="text" autocomplete="name" placeholder="Your name">

  <label for="email">Email (for your receipt)</label>
  <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

  <label for="amount">Amount (GHS) - as agreed with MOZLYT</label>
  <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">

  <button id="payBtn">Pay now</button>
  <div id="msg"></div>
  <div class="note">Secured by Paystack. Questions? WhatsApp 0538729743<br><a href="index.html" style="color:inherit">Back to MOZLYT</a></div>
</div>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
  // Public key only. Never put a secret key (sk_...) in this file.
  var PAYSTACK_PUBLIC_KEY = "pk_live_6d866e0acebda3502aa51b51f1ed24ad7b46763c";
  var CURRENCY = "GHS";

  // Optional prefill from the link: pay.html?amount=150&name=Ama&email=ama@mail.com
  var q = new URLSearchParams(location.search);
  var amtEl = document.getElementById("amount");
  function commaFmt(v) { v = String(v).replace(/[^\d.]/g, "").replace(/(\..*)\./, "$1"); var p = v.split("."); p[0] = p[0].replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+(?!\d))/g, ","); return p.length > 1 ? p[0] + "." + p[1].slice(0, 2) : p[0]; }
  amtEl.addEventListener("input", function () { var pos = amtEl.selectionStart, before = amtEl.value, digitsBefore = before.slice(0, pos).replace(/[^\d.]/g, "").length; amtEl.value = commaFmt(before); var c = 0, i = 0; for (; i < amtEl.value.length && c < digitsBefore; i++) { if (/[\d.]/.test(amtEl.value[i])) c++; } try { amtEl.setSelectionRange(i, i); } catch (e) {} });
  if (q.get("amount")) amtEl.value = commaFmt(q.get("amount"));
  if (q.get("name"))   document.getElementById("name").value = q.get("name");
  if (q.get("email"))  document.getElementById("email").value = q.get("email");

  var item = (q.get("item") || "").slice(0, 120);
  if (item) document.getElementById("sub").textContent = "Paying for: " + item + " (delivery is agreed separately on WhatsApp)";

  var msg = document.getElementById("msg");
  function show(text, cls) { msg.textContent = text; msg.className = cls || ""; }

  document.getElementById("payBtn").addEventListener("click", function () {
    var name = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim();
    var amount = parseFloat(String(document.getElementById("amount").value).replace(/,/g, ""));

    if (!name) return show("Please enter your name.", "err");
    if (!/^\S+@\S+\.\S+$/.test(email)) return show("Please enter a valid email.", "err");
    if (!amount || amount <= 0) return show("Please enter the agreed amount.", "err");
    if (typeof PaystackPop === "undefined") return show("Payment could not load. Check your internet and retry.", "err");

    var handler = PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: email,
      amount: Math.round(amount * 100), // pesewas
      currency: CURRENCY,
      ref: "MZL-" + Date.now(),
      metadata: { custom_fields: [{ display_name: "Customer name", variable_name: "customer_name", value: name }, { display_name: "Item", variable_name: "item", value: item || "Agreed service/order" }] },
      callback: function (response) {
        show("Payment received. Reference: " + response.reference + ". Thank you!", "ok");
      },
      onClose: function () {
        show("Payment window closed. No payment was made.", "err");
      }
    });
    handler.openIframe();
  });
</script>
</body>
</html>
