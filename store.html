@media(min-width:821px){.qa{grid-template-columns:repeat(6,1fr)}}

.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.per{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px;background:#fff}.per label{padding:9px 20px;font-weight:700;cursor:pointer}.per label.on{background:var(--ink);color:#fff}.per input{display:none}.plan ul{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--mute)}.plan li{margin:3px 0}.lockbox{background:#FFF8E6;border:1px solid #f1dfae;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14.5px}.lockbox .b2{margin-top:8px}
.plan{position:relative;display:flex;flex-direction:column;gap:2px;padding:16px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
.plan.on{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,107,79,.12)}
.plan input{position:absolute;opacity:0;pointer-events:none}
.plan .pr{font-size:1.5rem;font-weight:800}
.plan em{font-style:normal;color:#14663f;font-weight:700;font-size:.85rem;margin-top:4px}
@media(max-width:700px){.tiers{grid-template-columns:1fr}}

.it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.it .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.it .m{color:var(--mute);font-size:13.5px}
.it select,.it input,.it textarea{padding:8px 10px;border:1px solid #cfd8d2;border-radius:8px;font:14px inherit;font-family:inherit}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.tbl th{background:#f3f7f4;font-size:12.5px;color:var(--mute)}
.stack td[data-l="Store"]{font-size:16px}
@media(max-width:760px){.scroll{overflow:visible}.tbl.stack{display:block;border:0;background:none;border-radius:0}.tbl.stack tbody{display:block}.tbl.stack tr{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:6px 0;box-shadow:0 1px 2px rgba(16,40,30,.05)}.tbl.stack tr:first-child{display:none}.tbl.stack td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;padding:7px 14px;text-align:right}.tbl.stack td::before{content:attr(data-l);color:var(--mute);font-size:12.5px;text-align:left;flex:none}.tbl.stack td:empty{display:none}.tbl.stack td[data-l="Franchise"],.tbl.stack td[data-l="Subscription"]{flex-wrap:wrap;justify-content:flex-end}.tbl.stack td[data-l="Franchise"]::before,.tbl.stack td[data-l="Subscription"]::before{flex-basis:100%}.tbl.stack td>div,.tbl.stack td>span{max-width:100%}}
.tbl input{width:96px;padding:7px;border:1px solid #cfd8d2;border-radius:7px;font:14px inherit;font-family:inherit}
.scroll{overflow-x:auto}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.steps3{display:grid;gap:10px;margin:0;padding:0;list-style:none}.steps3 li{padding-left:34px;position:relative}
.steps3 li:before{content:attr(data-n);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14.5px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bar{height:8px;border-radius:99px;background:#e3ebe6;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.lsn{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;width:100%;font:inherit;color:var(--ink)}
.lsn .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #cfd8d2;display:grid;place-items:center;font-size:13px;color:#fff}.lsn.done .ck{background:var(--green);border-color:var(--green)}
.lbody{white-space:pre-wrap;line-height:1.65;font-size:16px}.vid{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin:0 0 14px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.f textarea{min-height:110px}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="sh"><div class="wrap sbar"><a class="sname" id="sName" href="#">Store</a><button type="button" class="cartbtn" id="cartBtn">Cart <b id="cartN">0</b></button></div></header>
<main class="dash" style="padding-top:18px"><div class="wrap">
<div id="state" class="empty">Loading store...</div>
<section id="shop" hidden>
  <h1 id="h1" style="margin-bottom:4px"></h1><p class="sub">Order here and the seller will confirm with you on WhatsApp.</p>
  <div class="tools"><input id="q" type="search" placeholder="Search products"><select id="cat"></select></div>
  <div class="grid3" id="grid"></div>
  <p class="sub" style="margin-top:26px;text-align:center;font-size:13.5px">Store powered by <a href="index.html" style="color:var(--green-d);text-decoration:underline">MOZLYT</a>. Photos are for illustration; the product you receive may differ slightly in colour or design.</p>
</section>
</div></main>

<div class="pmod" id="pmod" hidden role="dialog" aria-modal="true"><div class="pbg" id="pbg"></div><div class="pbox"><button type="button" class="px" id="px" aria-label="Close">&times;</button><div class="pimg" id="pimg"></div><div class="pbody"><h3 id="pname"></h3><div class="price" id="pprice"></div><p id="pdesc"></p><div id="pact"></div></div></div></div>
<div class="drawer" id="drawer" hidden><div class="dbg" id="dbg"></div><div class="dpanel">
  <div class="top2" style="margin:0 0 10px"><h3 style="margin:0">Your cart</h3><button class="b2 ghost" id="dclose" type="button">Close</button></div>
  <div id="clines"></div><div id="ctotal" style="font-weight:700;margin:10px 0"></div>
  <form id="fOrder" class="f">
    <label>Your name<input id="oName" required maxlength="80" autocomplete="name"></label>
    <label>Phone / WhatsApp<input id="oPhone" type="tel" required maxlength="20" autocomplete="tel"></label>
    <label>Delivery address or area<input id="oAddr" maxlength="200" autocomplete="street-address" placeholder="e.g. East Legon, near the mall"></label>
    <label>Note (optional)<textarea id="oNote" rows="2" maxlength="300"></textarea></label>
    <div id="oNoteBox"></div>
    <button class="btn primary" type="submit">Place order</button>
  </form>
  <div id="done" hidden></div>
</div></div>

<style>
.pc .ph,.pc h4{cursor:pointer}
.pmod{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px}.pmod[hidden]{display:none}.pbg{position:absolute;inset:0;background:rgba(10,20,15,.6)}
.pbox{position:relative;background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pimg{background:#eef3ef;display:grid;place-items:center;min-height:200px}.pimg img{width:100%;max-height:60vh;object-fit:contain;display:block}
.pbody{padding:16px;display:grid;gap:8px}.pbody h3{margin:0;font-size:20px}.pbody p{margin:0;color:var(--mute,#5b6b62);white-space:pre-wrap;line-height:1.5}
.px{position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:24px;line-height:1;cursor:pointer}

.sh{background:#0E2A47;color:#fff;position:sticky;top:0;z-index:20}.sbar{display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-bottom:12px}
.sname{color:#fff;font:700 20px Georgia,serif;text-decoration:none}.cartbtn{background:#F2B134;color:#0E2A47;border:0;border-radius:99px;padding:9px 16px;font:700 14.5px inherit;font-family:inherit;cursor:pointer}
.cartbtn b{background:#0E2A47;color:#fff;border-radius:99px;padding:1px 8px;margin-left:4px}
.pc .price{font:700 18px Georgia,serif;color:var(--ink)}
#grid.grid3{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#grid .pc .b{padding:10px;gap:6px}#grid .pc h4{font-size:14px;line-height:1.25}#grid .pc .price{font-size:16px}#grid .pc .b2{width:100%;padding:9px 8px;font-size:13.5px}
@media(min-width:760px){#grid.grid3{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}#grid .pc h4{font-size:15px}}
@media(min-width:1040px){#grid.grid3{grid-template-columns:repeat(4,minmax(0,1fr))}}
.drawer{position:fixed;inset:0;z-index:50}.dbg{position:absolute;inset:0;background:rgba(9,26,46,.5)}
.dpanel{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:#fff;padding:18px;overflow-y:auto}
.cl{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.cl .q{display:flex;align-items:center;gap:6px}.cl .q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
</style>

<script src="js/mz-api.js"></script>
<script>

var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return[].slice.call((r||document).querySelectorAll(s))};
function esc(s){return MZ.esc(s)}
var MZC="GH Ghana|NG Nigeria|BJ Benin|BF Burkina Faso|CM Cameroon|CV Cabo Verde|TD Chad|CI Cote d'Ivoire|GM Gambia|GN Guinea|GW Guinea-Bissau|LR Liberia|ML Mali|NE Niger|SN Senegal|SL Sierra Leone|TG Togo|AO Angola|BW Botswana|CD DR Congo|CG Congo|EG Egypt|ET Ethiopia|GA Gabon|KE Kenya|MW Malawi|MZ Mozambique|NA Namibia|RW Rwanda|ZA South Africa|TZ Tanzania|UG Uganda|ZM Zambia|ZW Zimbabwe|MA Morocco|DZ Algeria|TN Tunisia|GB United Kingdom|US United States|CA Canada|DE Germany|FR France|NL Netherlands|IT Italy|ES Spain|AE United Arab Emirates|IN India|BR Brazil|JM Jamaica|TT Trinidad and Tobago".split('|').map(function(x){return{c:x.slice(0,2),n:x.slice(3)}});
function mzCountry(c){c=String(c||'').toUpperCase();return MZC.filter(function(x){return x.c===c})[0]||null}
function mzFlag(c,h){var k=mzCountry(c);return k?'<img alt="" src="https://flagcdn.com/w40/'+k.c.toLowerCase()+'.png" style="height:'+(h||22)+'px;width:auto;vertical-align:-4px;border-radius:3px;margin-right:8px;box-shadow:0 0 0 1px rgba(0,0,0,.12)">':''}
function markMiss(ids){$$('.miss').forEach(function(e){e.classList.remove('miss')});ids.forEach(function(id){var e=document.getElementById(id);if(!e)return;(e.closest('label')||e).classList.add('miss')})}
function pwEye(){document.querySelectorAll('input[type=password]').forEach(function(i){if(i.dataset.eye)return;i.dataset.eye='1';var w=document.createElement('span');w.style.cssText='position:relative;display:block';i.parentNode.insertBefore(w,i);w.appendChild(i);i.style.paddingRight='64px';var b=document.createElement('button');b.type='button';b.textContent='Show';b.setAttribute('aria-label','Show password');b.style.cssText='position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#14663f;font-weight:700;font-size:13px;padding:8px;cursor:pointer';b.onclick=function(){var h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'Hide':'Show';b.setAttribute('aria-label',h?'Hide password':'Show password')};w.appendChild(b)})}
pwEye();
function show(id,on){var e=$('#'+id);if(e)e.hidden=!on}
function flash(t,ms){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},ms||2600)}
function note(box,type,text){box.innerHTML=text?'<div class="msg '+type+'">'+esc(text)+'</div>':''}
function busy(btn,on,label){if(!btn)return;btn.disabled=on;if(on){if(label){btn.dataset.l=btn.textContent;btn.textContent=label}}else if(btn.dataset.l){btn.textContent=btn.dataset.l;delete btn.dataset.l}}
function copy(t){return(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){flash('Copied')},function(){var i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();try{document.execCommand('copy');flash('Copied')}catch(e){prompt('Copy this:',t)}i.remove()})}

(function(){
  var STORE=null,CART={},KEY='mz-cart-';
  var slug=(new URLSearchParams(location.search).get('s')||'').toLowerCase();

  function start(sl){
    if(!sl){fail('No store selected. Check the link you were given.');return}
    MZ.rpc('get_store',{p_slug:sl}).then(function(s){
      if(!s){fail('We could not find this store. It may have moved or been paused.');return}
      if(s.inactive){var w=String(s.whatsapp||'').replace(/\D/g,'');if(w.charAt(0)==='0')w='233'+w.slice(1);$('#state').innerHTML='<b>'+esc(s.store_name)+'</b> is temporarily closed.<br>'+(w?'<a class="b2" style="display:inline-block;margin-top:12px;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+w+'">Message the seller on WhatsApp</a>':'Please check back soon.');document.title=s.store_name+' | MOZLYT';return}
      STORE=s;slug=sl;try{CART=JSON.parse(localStorage.getItem(KEY+slug)||'{}')}catch(e){CART={}}
      document.title=s.store_name+' | MOZLYT';MZ.pixels(s.meta_pixel,s.tiktok_pixel);MZ.track('ViewContent',{});$('#sName').textContent=s.store_name;$('#h1').textContent=s.store_name;
      show('state',false);show('shop',true);cats();draw();cartDraw();
    },function(er){fail(er.message)})}
  function fail(t){$('#state').textContent=t}
  /* a seller's own domain: look the store up from the web address */
  if(!slug&&!/(^|\.)mozlyt\.com$|github\.io$|^localhost$/.test(location.hostname)){MZ.rpc('resolve_domain',{p_host:location.hostname.replace(/^www\./,'')}).then(function(r){return r||MZ.rpc('resolve_domain',{p_host:location.hostname})}).then(function(r){start(r)},function(){start('')})}else start(slug);

  function cats(){var c=['All categories'].concat(STORE.products.map(function(p){return p.category}).filter(function(x,i,a){return a.indexOf(x)===i}));$('#cat').innerHTML=c.map(function(x){return'<option>'+esc(x)+'</option>'}).join('')}
  function draw(){var q=$('#q').value.toLowerCase().trim(),c=$('#cat').value;
    var list=STORE.products.filter(function(p){return(c==='All categories'||p.category===c)&&(!q||p.name.toLowerCase().indexOf(q)>-1)});
    $('#grid').innerHTML=list.map(function(p){return'<div class="pc"><div class="ph" data-v="'+p.id+'">'+(p.photo?'<img loading="lazy" decoding="async" alt="'+esc(p.name)+'" src="'+esc(WP(p.photo))+'" data-o="'+esc(p.photo)+'" onerror="if(this.dataset.o&&this.src.indexOf(this.dataset.o)<0){this.src=this.dataset.o}">':'Photo coming soon')+'</div><div class="b"><h4 data-v="'+p.id+'">'+esc(p.name)+'</h4><div class="price">'+MZ.money(p.price)+'</div>'+(p.sold_out?'<span class="tag bad">Sold out</span>':'<button class="b2" data-id="'+p.id+'">Add to cart</button>')+'</div></div>'}).join('')||'<div class="empty" style="grid-column:1/-1">'+(STORE.products.length?'No products match.':'This store is getting ready. Please check back soon.')+'</div>';
    $$('#grid [data-id]').forEach(function(b){b.onclick=function(){addCart(b.dataset.id)}});
    $$('#grid [data-v]').forEach(function(b){b.onclick=function(){openProd(b.dataset.v)}});
  }
  function addCart(id){CART[id]=(CART[id]||0)+1;save();flash('Added to cart');var pp=prod(id);MZ.track('AddToCart',{value:pp?pp.price:0,name:pp?pp.name:''})}
  function WP(u){return /^img\/p\/[^?]+\.jpg$/.test(u||'')?u.slice(0,-4)+'.webp':u}
  function openProd(id){var p=prod(id);if(!p)return;$('#pimg').innerHTML=p.photo?'<img alt="'+esc(p.name)+'" src="'+esc(WP(p.photo))+'" data-o="'+esc(p.photo)+'" onerror="if(this.dataset.o&&this.src.indexOf(this.dataset.o)<0){this.src=this.dataset.o}">':'<span style="color:#5b6b62;padding:40px">Photo coming soon</span>';$('#pname').textContent=p.name;$('#pprice').textContent=MZ.money(p.price);$('#pdesc').textContent=p.description||'No description yet.';
    $('#pact').innerHTML=p.sold_out?'<span class="tag bad">Sold out</span>':'<button class="btn primary" type="button" id="pAdd" style="width:100%">Add to cart</button>';var a=$('#pAdd');if(a)a.onclick=function(){addCart(id);$('#pmod').hidden=true};$('#pmod').hidden=false}
  $('#px').onclick=$('#pbg').onclick=function(){$('#pmod').hidden=true};document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#pmod').hidden=true});
  $('#q').addEventListener('input',draw);$('#cat').addEventListener('change',draw);

  function save(){try{localStorage.setItem(KEY+slug,JSON.stringify(CART))}catch(e){}cartDraw()}
  function prod(id){return STORE.products.filter(function(p){return String(p.id)===String(id)})[0]}
  function lines(){return Object.keys(CART).map(function(id){var p=prod(id);return p?{p:p,q:CART[id]}:null}).filter(Boolean)}
  function total(){return lines().reduce(function(s,l){return s+l.p.price*l.q},0)}
  function cartDraw(){var L=lines();$('#cartN').textContent=L.reduce(function(s,l){return s+l.q},0);
    $('#clines').innerHTML=L.map(function(l){return'<div class="cl"><span>'+esc(l.p.name)+'<br><small>'+MZ.money(l.p.price)+'</small></span><span class="q"><button data-d="'+l.p.id+'" aria-label="Less">&minus;</button>'+l.q+'<button data-u="'+l.p.id+'" aria-label="More">+</button></span></div>'}).join('')||'<div class="empty">Your cart is empty.</div>';
    $('#ctotal').textContent=L.length?'Total: '+MZ.money(total()):'';$('#fOrder').hidden=!L.length;
    $$('#clines [data-d]').forEach(function(b){b.onclick=function(){var id=b.dataset.d;CART[id]--;if(CART[id]<=0)delete CART[id];save()}});$$('#clines [data-u]').forEach(function(b){b.onclick=function(){CART[b.dataset.u]++;save()}})}
  $('#cartBtn').onclick=function(){show('done',false);show('drawer',true)};$('#dbg').onclick=$('#dclose').onclick=function(){show('drawer',false)};

  $('#fOrder').onsubmit=function(e){e.preventDefault();var b=$('button[type=submit]',this),L=lines();if(!L.length)return;
    busy(b,true,'Sending...');note($('#oNoteBox'),'','');
    MZ.rpc('place_store_order',{p_slug:slug,p_name:$('#oName').value.trim(),p_phone:$('#oPhone').value.trim(),p_address:$('#oAddr').value.trim(),p_notes:$('#oNote').value.trim(),p_items:L.map(function(l){return{product_id:l.p.id,qty:l.q}})}).then(function(id){
      var txt='Hello '+STORE.store_name+', I just placed order #'+id+':\n'+L.map(function(l){return l.q+' x '+l.p.name+' ('+MZ.money(l.p.price*l.q)+')'}).join('\n')+'\nTotal: '+MZ.money(total())+'\nName: '+$('#oName').value.trim()+'\nDelivery: '+($('#oAddr').value.trim()||'to be agreed');
      var url='https://wa.me/'+MZ.phoneIntl(STORE.whatsapp)+'?text='+encodeURIComponent(txt);
      MZ.track('Purchase',{value:total()});CART={};save();show('fOrder',false);$('#clines').innerHTML='';$('#ctotal').textContent='';
      $('#done').innerHTML='<div class="msg ok"><b>Order #'+id+' received.</b> The seller will confirm with you shortly.</div><a class="btn primary" style="width:100%;justify-content:center" target="_blank" rel="noopener" href="'+url+'">Send the details on WhatsApp</a>';show('done',true);
    },function(er){note($('#oNoteBox'),'err',/not available/i.test(er.message)?'One of the items is no longer available. Please remove it and try again.':er.message)}).then(function(){busy(b,false)})};
})();
</script>
</body></html>
